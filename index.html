<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>TD Hub</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Slab:wght@600;700&display=swap">
<style>
/* Applicatie met zijbalk. Grote S, Q en D zijn de stoplichten van de dagstart: rood zodra er een open melding staat. Goud alleen voor actieve navigatie en de hoofdactie. */
:root{
  --bg:#FFFFFF;--side:#F6F6F3;--sunken:#F2F2EE;--hover:#F7F6F1;
  --ink:#1D2023;--ink2:#565B60;--ink3:#73787D;--line:#E8E8E3;--line2:#D8D8D2;
  --gold:#E3A416;--gold-ink:#7D5A00;--on-gold:#1D2023;--gold-soft:#FBF1D7;
  --ok:#1C8350;--warn:#C27A0E;--warn2:#E9B44C;--crit:#C5382D;--info:#2C6DB2;--none:#A9ADB1;
  --crit-ink:#A92C22;--warn-ink:#8F5A06;--white:#FFFFFF;--shadow:rgba(20,22,24,.14);
  --font:"Roboto",Arial,"Helvetica Neue",sans-serif;
  --kop:"Roboto Slab",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17191B;--side:#1E2124;--sunken:#24272A;--hover:#212427;
  --ink:#ECEDEB;--ink2:#B3B7BA;--ink3:#868B90;--line:#2C3033;--line2:#3B4044;
  --gold:#E3A416;--gold-ink:#F0C565;--on-gold:#1D2023;--gold-soft:#3A2F13;
  --ok:#3FB47A;--warn:#E0A03A;--warn2:#B98223;--crit:#E86A5E;--info:#6DA8E5;--none:#6C7176;
  --crit-ink:#F08B81;--warn-ink:#EDB962;--white:#FFFFFF;--shadow:rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191B;--side:#1E2124;--sunken:#24272A;--hover:#212427;
  --ink:#ECEDEB;--ink2:#B3B7BA;--ink3:#868B90;--line:#2C3033;--line2:#3B4044;
  --gold:#E3A416;--gold-ink:#F0C565;--on-gold:#1D2023;--gold-soft:#3A2F13;
  --ok:#3FB47A;--warn:#E0A03A;--warn2:#B98223;--crit:#E86A5E;--info:#6DA8E5;--none:#6C7176;
  --crit-ink:#F08B81;--warn-ink:#EDB962;--white:#FFFFFF;--shadow:rgba(0,0,0,.45);
  color-scheme:dark}
*{box-sizing:border-box}
html{font-size:16px}
html.present{font-size:clamp(17px,1.25vw,26px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 .9375rem/1.45 var(--font);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* toegang */
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--side)}
#lockform{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;padding:28px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
#lockform h1{margin:6px 0 0;font:700 1.375rem/1.25 var(--kop)}
#lockform p{margin:0;color:var(--ink2)}
#lockform label{font-weight:500;font-size:.875rem}
#pw{width:100%;font-size:16px;padding:10px 12px;margin-top:6px;background:var(--bg);border:1px solid var(--line2);border-radius:8px}
#lockform .rem{display:flex;gap:8px;align-items:center;font-weight:400;color:var(--ink2)}
#lockbtn{padding:11px 14px;border:0;border-radius:8px;background:var(--gold);color:var(--on-gold);font-weight:500;cursor:pointer}
#lockbtn:disabled{opacity:.6;cursor:progress}
#lockerr{color:var(--crit-ink);font-size:.875rem}
.mark{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;background:var(--gold);color:var(--on-gold);font:700 .8125rem/1 var(--kop)}
.merk{font-size:.6875rem;letter-spacing:.02em;color:var(--ink3)}

/* schil */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:16px 12px 14px;background:var(--side);border-right:1px solid var(--line);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 4px}
.brand b{display:block;font:700 1rem/1.2 var(--kop)}
.brand small{display:block;color:var(--ink2);font-size:.75rem;line-height:1.3}
nav .kopje{display:block;padding:0 10px 5px;font-size:.75rem;font-weight:500;color:var(--ink3)}
nav .sectie + .sectie{margin-top:18px}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:7px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:.875rem}
nav a:hover{background:var(--sunken);color:var(--ink)}
nav a[aria-current="page"]{background:var(--gold-soft);color:var(--ink)}
nav a[aria-current="page"] .i{color:var(--gold-ink)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding:0 10px;color:var(--ink2);font-size:.75rem}
.topbar{display:none}
.shell{min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1320px;padding-block:24px 48px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px}
.head h1{margin:0;font:700 1.5rem/1.2 var(--kop);text-wrap:balance}
.head p{margin:4px 0 0;color:var(--ink2);max-width:70ch}
.knop{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:7px 12px;border:1px solid var(--line2);border-radius:7px;background:var(--bg);font-weight:500;font-size:.875rem;cursor:pointer;white-space:nowrap}
.knop:hover{background:var(--hover)}
.knop.hoofd{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.knop.hoofd:hover{filter:brightness(.96)}
.deel{margin-top:28px}
.deel h2{margin:0 0 10px;font-size:1rem;font-weight:700}
.deelkop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
html.present .deelkop .knop{display:none}
.deel h2 span{margin-left:6px;font-weight:400;color:var(--ink3)}

/* werkbalk */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.zoek{position:relative;flex:0 1 280px;min-width:180px}
.zoek .i{position:absolute;left:10px;top:50%;margin-top:-8px;width:16px;height:16px;color:var(--ink3)}
.zoek input{width:100%;font-size:16px;line-height:1.2;padding:7px 10px 7px 32px;background:var(--bg);border:1px solid var(--line2);border-radius:7px}
.toolbar select{font-size:.875rem;padding:7px 8px;background:var(--bg);border:1px solid var(--line2);border-radius:7px;max-width:100%}
.toggle{display:inline-flex;gap:7px;align-items:center;font-size:.875rem;color:var(--ink2)}
.seg{display:inline-flex;gap:1px;padding:2px;background:var(--sunken);border-radius:8px;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.seg::-webkit-scrollbar{display:none}
.seg button{padding:5px 10px;border:0;border-radius:6px;background:none;color:var(--ink2);font-size:.8125rem;font-weight:500;white-space:nowrap;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.seg span{margin-left:5px;color:var(--ink3);font-weight:400}

/* tabellen */
.tblwrap{margin-inline:-12px}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.875rem}
.tbl th{position:sticky;top:0;z-index:1;background:var(--bg);padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;color:var(--ink2);font-size:.8125rem;font-weight:500;white-space:nowrap}
.tbl th[data-k]{cursor:pointer}
.tbl th[data-k]:hover{color:var(--ink)}
.tbl th .pijl{margin-left:3px;color:var(--ink3)}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
.tbl tbody tr.klik{cursor:pointer}
.tbl tbody tr.klik:hover td{background:var(--hover)}
.tbl .nr{white-space:nowrap;color:var(--ink2);font-weight:500}
.tbl .titel{font-weight:500}
.tbl .nowrap{white-space:nowrap}
.tbl .num{text-align:right}
.tbl tr.laat td{background:color-mix(in srgb,var(--crit) 9%,transparent)}
.st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.st i{width:8px;height:8px;border-radius:50%;background:var(--none);flex:none}
.st.info i{background:var(--info)}.st.warn i{background:var(--warn)}.st.warn2 i{background:var(--warn2)}.st.crit i{background:var(--crit)}.st.ok i{background:var(--ok)}
.st.leeg i{background:none;box-shadow:inset 0 0 0 1.5px var(--none)}
.p{white-space:nowrap;font-weight:500}.p.p1{color:var(--crit-ink)}.p.p2{color:var(--warn-ink)}.p.p3{color:var(--ink2)}
.zacht{color:var(--ink3)}
.leegmelding{padding:28px 12px;color:var(--ink2);text-align:center;border-bottom:1px solid var(--line)}
.tellen{color:var(--ink2);font-size:.8125rem;margin:0 0 6px}

/* SQD-bord */
.bord{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:12px}
.pijler{display:flex;flex-direction:column;gap:14px;min-width:0;padding:18px 20px 18px}
.pijler + .pijler{border-left:1px solid var(--line)}
.pkop{display:flex;align-items:center;gap:14px}
.letter{font:700 3.5rem/1 var(--kop);color:var(--none)}
.pijler.groen .letter{color:var(--ok)}
.pijler.rood .letter{color:var(--crit)}
.pkop h2{margin:0;font-size:1.0625rem;font-weight:700}
.pkop .st{font-size:.8125rem;color:var(--ink2)}
.cijfers{margin:0;display:flex;flex-direction:column;gap:4px;font-size:.875rem}
.cijfers div{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.cijfers dt{color:var(--ink2);min-width:0}
.cijfers dd{margin:0;font-weight:700}
.punten{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.geenpunten{margin:0;color:var(--ink3)}
.pijler .knop{align-self:flex-start;margin-top:auto}
html.present .pijler .knop{display:none}
.meldingen{display:flex;flex-direction:column;gap:6px}
.melding{display:block;width:100%;padding:9px 11px;border:1px solid var(--line2);border-radius:8px;background:var(--bg);text-align:left;cursor:pointer}
.melding:hover{background:var(--hover)}
.melding b{display:block;font-weight:500}
.melding small{display:block;margin-top:2px;color:var(--ink2);font-size:.8125rem}

/* meldformulier */
.meldform{display:flex;flex-direction:column;gap:14px;padding:16px 20px 24px}
.meldform label{display:flex;flex-direction:column;gap:5px;font-size:.875rem;font-weight:500}
.meldform input[type=text],.meldform input[type=date],.meldform textarea,.meldform select{width:100%;font-size:16px;font-weight:400;padding:9px 10px;background:var(--bg);border:1px solid var(--line2);border-radius:7px}
.meldform textarea{min-height:96px;resize:vertical}
.meldform .twee{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.meldform .vink{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.meldform .fout{margin:0;color:var(--crit-ink);font-size:.875rem}
.melding-acties{padding:0 20px 24px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;transform:translateX(-50%);padding:9px 14px;border-radius:8px;background:var(--ink);color:var(--bg);font-size:.875rem;font-weight:500;max-width:calc(100% - 32px)}

/* kengetallen en balken */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:12px}
.kpi{display:block;padding:14px 18px;text-decoration:none}
.kpi + .kpi{border-left:1px solid var(--line)}
.kpi:hover{background:var(--hover)}
.kpi span{display:block;color:var(--ink2);font-size:.8125rem}
.kpi b{display:block;margin-top:2px;font:700 1.875rem/1.15 var(--kop)}
.kpi.let b{color:var(--crit-ink)}
.balken{display:flex;flex-direction:column;gap:8px}
.balk{display:grid;grid-template-columns:7.5rem minmax(0,1fr) 2.2rem;gap:12px;align-items:center;font-size:.875rem}
.balk .spoor{display:flex;gap:2px;height:14px;min-width:0}
.balk .spoor i{display:block;border-radius:3px;min-width:3px}
.balk .tot{text-align:right;font-weight:500}
.legenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.8125rem;color:var(--ink2)}
.vulbalk{height:10px;border-radius:5px;background:var(--sunken);overflow:hidden;min-width:80px}
.vulbalk i{display:block;height:100%;background:var(--gold)}

/* detailpaneel */
.waas{position:fixed;inset:0;z-index:20;background:rgba(20,22,24,.32)}
.paneel{position:fixed;top:0;right:0;bottom:0;z-index:21;width:min(440px,100%);display:flex;flex-direction:column;background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 32px var(--shadow);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom,0px)}
.pkopbalk{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:16px 20px 12px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.pkopbalk small{display:block;color:var(--ink2);font-weight:500}
.pkopbalk h2{margin:2px 0 0;font:700 1.125rem/1.3 var(--kop)}
.icoonknop{display:inline-flex;padding:6px;border:0;border-radius:7px;background:none;color:var(--ink2);cursor:pointer}
.icoonknop:hover{background:var(--sunken)}
.velden{margin:0;padding:12px 20px 24px;display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:9px 14px;font-size:.875rem}
.velden dt{color:var(--ink2)}
.velden dd{margin:0;overflow-wrap:anywhere}
.velden a{color:var(--gold-ink)}

/* presentatie */
.pbalk{display:none}
html.present #app{grid-template-columns:minmax(0,1fr)}
html.present .side,html.present .topbar,html.present .toolbar,html.present .seg,html.present .head .knop{display:none}
html.present .pbalk{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px max(32px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
html.present .pbalk .stappen{display:flex;gap:4px}
html.present .pbalk .stappen button{padding:6px 12px;border:0;border-radius:7px;background:none;color:var(--ink2);font-weight:500;cursor:pointer}
html.present .pbalk .stappen button[aria-current="true"]{background:var(--gold-soft);color:var(--ink)}
html.present .page{max-width:none}

/* telefoon en tablet */
@media (max-width:980px){
  #app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;z-index:22;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-102%);transition:transform .18s ease;padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-bottom:1px solid var(--line)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
  .topbar b{font:700 1rem/1.2 var(--kop)}
  .page{padding-block:16px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .head .knop{display:none}
  .bord{grid-template-columns:minmax(0,1fr)}
  .pijler + .pijler{border-left:0;border-top:1px solid var(--line)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi:nth-child(3){border-left:0}
  .kpi:nth-child(n+3){border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .zoek{flex:1 1 100%}
  .tbl thead{display:none}
  .tbl,.tbl tbody{display:block}
  .tbl tr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;padding:11px 12px;border-bottom:1px solid var(--line)}
  .tbl td{display:block;padding:0;border:0}
  .tbl .m-nr{grid-column:1;grid-row:1}
  .tbl .m-status{grid-column:3;grid-row:1;justify-self:end}
  .tbl .m-main{grid-column:1/-1}
  .tbl .m-sub{grid-column:1/-1;color:var(--ink2);font-size:.8125rem}
  .tbl .m-hide{display:none}
  .tbl td[data-l]::before{content:attr(data-l) ": ";color:var(--ink3)}
  .tbl .num{text-align:left}
  .balk{grid-template-columns:5.8rem minmax(0,1fr) 1.8rem;gap:8px}
  .velden{grid-template-columns:minmax(0,1fr);gap:0}
  .velden dt{margin-top:10px;font-size:.8125rem}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
</style>

<div id="lock" hidden>
  <form id="lockform" autocomplete="off">
    <span class="mark" aria-hidden="true">TD</span>
    <h1>TD Hub</h1>
    <p>Voer het wachtwoord in om verder te gaan.</p>
    <label for="pw">Wachtwoord<input id="pw" type="password" autocomplete="current-password" required></label>
    <label class="rem" for="rem"><input id="rem" type="checkbox" checked> Onthoud op dit apparaat</label>
    <span id="lockerr" hidden>Dit wachtwoord klopt niet. Vraag het na bij de werkvoorbereider.</span>
    <button type="submit" id="lockbtn">Openen</button>
  </form>
  <span class="merk">Muller Technical Solutions</span>
</div>

<div id="app" hidden>
  <div class="waas" id="menuwaas" hidden></div>
  <aside class="side" id="side">
    <div class="brand"><span class="mark" aria-hidden="true">TD</span><span><b>TD Hub</b><small>Dutch Bakery Group Eindhoven</small></span></div>
    <nav id="nav" aria-label="Pagina's"></nav>
    <div class="sidefoot"><span id="stand"></span><span class="merk">Muller Technical Solutions</span></div>
  </aside>
  <div class="shell">
    <div class="topbar"><button class="icoonknop" id="menu" aria-label="Menu openen"></button><b>TD Hub</b></div>
    <div class="pbalk" id="pbalk"><b id="pdatum"></b><div class="stappen" id="stappen"></div><button class="knop" id="psluit">Sluiten</button></div>
    <main class="page" id="view"></main>
  </div>
  <div class="waas" id="paneelwaas" hidden></div>

const GESLOTEN=["Uitgevoerd","Gereed","Dubbel","Vervallen"];
const isOpen=r=>!GESLOTEN.includes(r.status);
const LIJNEN=["Lijn 1","Lijn 2","Lijn 3","Overig","Lijn onbekend"];
const lijnGroep=r=>{const l=r.lijn;if(l==="Lijn 1"||l==="Lijn 2"||l==="Lijn 3")return l;if(!l||/n\.t\.b/.test(l))return"Lijn onbekend";return"Overig"};
const nummer=s=>{const m=/\d+/.exec(s||"");return m?+m[0]:1e9};
const stand=k=>(D.meta&&D.meta.standen&&D.meta.standen[k])||"";
const datum=s=>{const m=/^(\d{2})-(\d{2})-(\d{4})/.exec(s||"");return m?new Date(+m[3],+m[2]-1,+m[1]):null};
const langeDatum=d=>d.toLocaleDateString("nl-NL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const hoofd=s=>s.charAt(0).toUpperCase()+s.slice(1);
function verlopen(d){
  const m=/^(\d{2})-(\d{2})-(\d{4})(?:\s+(\d{1,2}):(\d{2}))?/.exec(d||"");
  return m?new Date(+m[3],+m[2]-1,+m[1],m[4]!=null?+m[4]:23,m[5]!=null?+m[5]:59)<new Date():false;
}
function kop(titel,sub,dagstart){
  return'<div class="head"><div><h1>'+esc(titel)+"</h1>"+(sub?"<p>"+esc(sub)+"</p>":"")+"</div>"+(dagstart?'<button class="knop hoofd" data-present>'+ico("scherm")+"Presenteren</button>":"")+"</div>";
}

/* ---- tabel met zoeken, filteren, sorteren en detail ---- */
function tabelKop(cols,sort){
  return"<thead><tr>"+cols.map(c=>{
    const a=sort&&sort.k===c.k?'<span class="pijl">'+(sort.d>0?"↑":"↓")+"</span>":"";
    return"<th"+(c.s?' data-k="'+c.k+'"':"")+(c.n?' class="num"':"")+(c.w?' style="width:'+c.w+'"':"")+">"+esc(c.l)+a+"</th>";
  }).join("")+"</tr></thead>";
}
function rij(r,cols,i,detail,extra){
  return"<tr"+(detail?' class="klik'+(extra||"")+'" tabindex="0" data-i="'+i+'"':extra?' class="'+extra.trim()+'"':"")+">"+cols.map(c=>{
    const k=[c.c||"m-hide",c.n?"num":"",c.x||""].filter(Boolean).join(" ");
    return'<td class="'+k+'"'+(c.ml?' data-l="'+esc(c.ml)+'"':"")+">"+c.r(r)+"</td>";
  }).join("")+"</tr>";
}
function lijstScherm(cfg){
  const s=mem[cfg.key]||(mem[cfg.key]={q:"",seg:"",sel:{},alleen:cfg.alleen?cfg.alleen.standaard!==false:false,sort:null});
  let html=kop(cfg.titel,cfg.sub,cfg.dagstart);
  if(cfg.seg)html+='<div class="seg" id="seg" role="group" aria-label="Filter op status"></div>';
  html+='<div class="toolbar"><div class="zoek">'+ico("zoek")+'<input type="search" id="q" placeholder="Zoeken" aria-label="Zoeken" value="'+esc(s.q)+'"></div>';
  (cfg.selects||[]).forEach(f=>{html+='<select id="f_'+f.k+'" aria-label="'+esc(f.l)+'"><option value="">'+esc(f.l)+"</option>"+f.o.map(o=>'<option value="'+esc(o)+'"'+(o===s.sel[f.k]?" selected":"")+">"+esc(o)+"</option>").join("")+"</select>"});
  if(cfg.alleen)html+='<label class="toggle"><input type="checkbox" id="alleen"'+(s.alleen?" checked":"")+"> "+esc(cfg.alleen.l)+"</label>";
  html+='</div><p class="tellen" id="tellen" role="status"></p><div class="tblwrap" id="tabel"></div>';
  $("#view").innerHTML=html;
  let zicht=[];
  function basis(){
    const w=norm(s.q).split(/\s+/).filter(Boolean);
    return cfg.rijen.filter(r=>{
      if(s.alleen&&cfg.alleen&&!cfg.alleen.test(r))return false;
      for(const f of cfg.selects||[]){const v=s.sel[f.k];if(v&&f.get(r)!==v)return false}
      if(w.length){const h=norm(cfg.tekst(r));if(!w.every(x=>h.includes(x)))return false}
      return true;
    });
  }
  function teken(){
    let b=basis();
    if(cfg.seg){
      const tel=v=>b.filter(r=>cfg.seg.get(r)===v).length;
      const opties=cfg.seg.o.filter(v=>tel(v)>0||s.seg===v);
      $("#seg").innerHTML='<button data-seg="" aria-pressed="'+(!s.seg)+'">Alles<span>'+b.length+"</span></button>"+opties.map(v=>'<button data-seg="'+esc(v)+'" aria-pressed="'+(s.seg===v)+'">'+esc(v)+"<span>"+tel(v)+"</span></button>").join("");
      if(s.seg)b=b.filter(r=>cfg.seg.get(r)===s.seg);
    }
    if(s.sort){const c=cfg.kolommen.find(x=>x.k===s.sort.k);b=b.slice().sort((x,y)=>{const a=c.s(x),e=c.s(y);return(a>e?1:a<e?-1:0)*s.sort.d})}
    zicht=b;
    $("#tellen").textContent=b.length+" "+(b.length===1?cfg.eenheid[0]:cfg.eenheid[1]);
    $("#tabel").innerHTML=b.length?'<table class="tbl">'+tabelKop(cfg.kolommen,s.sort)+"<tbody>"+b.map((r,i)=>rij(r,cfg.kolommen,i,!!cfg.detail)).join("")+"</tbody></table>":'<div class="leegmelding">'+esc(cfg.geen||"Niets gevonden. Pas de filters aan.")+"</div>";
  }
  $("#q").addEventListener("input",e=>{s.q=e.target.value;teken()});
  (cfg.selects||[]).forEach(f=>$("#f_"+f.k).addEventListener("change",e=>{s.sel[f.k]=e.target.value;teken()}));
  if(cfg.alleen)$("#alleen").addEventListener("change",e=>{s.alleen=e.target.checked;teken()});
  if(cfg.seg)$("#seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){s.seg=b.dataset.seg;teken()}});
  const tb=$("#tabel");
  tb.addEventListener("click",e=>{
    const th=e.target.closest("th[data-k]");
    if(th){const k=th.dataset.k;s.sort=s.sort&&s.sort.k===k?(s.sort.d>0?{k,d:-1}:null):{k,d:1};teken();return}
    const tr=e.target.closest("tr[data-i]");
    if(tr&&cfg.detail)openPaneel(cfg.detail(zicht[+tr.dataset.i]));
  });
  tb.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[data-i]")){e.preventDefault();openPaneel(cfg.detail(zicht[+e.target.dataset.i]))}});
  teken();
}
function vasteTabel(cols,rijen,detail,klasse){
  const id="t"+Math.random().toString(36).slice(2,8);
  (vasteTabel.reg=vasteTabel.reg||{})[id]={rijen,detail};
  return'<div class="tblwrap" data-t="'+id+'"><table class="tbl">'+tabelKop(cols,null)+"<tbody>"+rijen.map((r,i)=>rij(r,cols,i,!!detail,klasse?klasse(r):"")).join("")+"</tbody></table></div>";
}
document.addEventListener("click",e=>{
  const w=e.target.closest("[data-t]"),tr=e.target.closest("tr[data-i]");
  if(w&&tr){const t=vasteTabel.reg[w.dataset.t];if(t&&t.detail){const d=t.detail(t.rijen[+tr.dataset.i]);if(d)openPaneel(d)}}
  if(e.target.closest("[data-present]"))presenteer(true);
  const nieuw=e.target.closest("[data-meld]");if(nieuw)openMelding(nieuw.dataset.meld);
  const bestaand=e.target.closest("[data-melding]");if(bestaand){const m=(MELDINGEN||[]).find(x=>x.id===bestaand.dataset.melding);if(m)openDetailMelding(m)}
});
document.addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&e.target.matches("[data-t] tr[data-i]")){e.preventDefault();const t=vasteTabel.reg[e.target.closest("[data-t]").dataset.t],d=t.detail(t.rijen[+e.target.dataset.i]);if(d)openPaneel(d)}
  if(e.key==="Escape"){if(!$("#paneel").hidden)sluitPaneel();else if(document.documentElement.classList.contains("present"))presenteer(false)}
  if(document.documentElement.classList.contains("present")&&$("#paneel").hidden){
    const l=P_DAG.map(p=>p.id),i=l.indexOf(HUIDIG);
    if(["ArrowRight","PageDown"," "].includes(e.key)&&!e.target.matches("button")){e.preventDefault();if(i<l.length-1)location.hash=l[i+1]}
    if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();if(i>0)location.hash=l[i-1]}
  }
});

/* ---- detailpaneel ---- */
let terug=null;
function openPaneel(d){
  terug=document.activeElement;
  const velden=d.velden.filter(v=>!leeg(v[1])).map(v=>"<dt>"+esc(v[0])+"</dt><dd>"+(v[2]?v[1]:esc(v[1]))+"</dd>").join("");
  const p=$("#paneel");
  p.innerHTML='<div class="pkopbalk"><div>'+(d.klein?"<small>"+esc(d.klein)+"</small>":"")+'<h2 id="ptitel">'+esc(d.titel)+'</h2></div><button class="icoonknop" id="psl" aria-label="Sluiten">'+ico("sluit")+'</button></div><dl class="velden">'+velden+"</dl>";
  p.hidden=false;$("#paneelwaas").hidden=false;p.focus();

}
function sluitPaneel(){$("#paneel").hidden=true;$("#paneelwaas").hidden=true;if(terug&&terug.focus)terug.focus()}
const cmDetail=r=>({klein:r.nr,titel:r.omschrijving,velden:[["Status",st(r.status),true],["Prio",r.prio?prio(r.prio):null,true],["Lijn",r.lijn],["Machine",r.machine],["Melder",r.melder],["Uitvoeren op",r.uitvoeren],["Onderdelen",r.onderdelen],["Opmerking",r.opmerking],["Uitgevoerd op",r.uitgevoerd_op],["Monteur",r.monteur],["Afgetekend",r.afgetekend],["Bron",r.bron]]});

/* ---- SQD-overzicht ---- */
const MELD=()=>(D.meta&&D.meta.meldingen&&D.meta.meldingen.url)?D.meta.meldingen:null;
let MELDINGEN=null,MELDFOUT=false,klok=null;
const LETTERS={S:"Safety",Q:"Quality",D:"Delivery",DIR:"Directie-actie binnen 24 uur"};
function naam(w){try{if(w!==undefined)localStorage.setItem("td-hub-naam",w);return localStorage.getItem("td-hub-naam")||""}catch(_){return w||""}}
function melder(t){const e=document.createElement("div");e.className="toast";e.setAttribute("role","status");e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
async function haalMeldingen(){
  const m=MELD();if(!m)return;
  try{const r=await fetch(m.url+"?k="+encodeURIComponent(m.sleutel));const j=await r.json();if(j.fout)throw 0;MELDINGEN=j.meldingen||[];MELDFOUT=false}
  catch(_){MELDFOUT=true}
  if(HUIDIG==="sqd"&&$("#paneel").hidden)vSqd();
}
async function stuur(d){
  const m=MELD();
  const r=await fetch(m.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({k:m.sleutel},d))});
  const j=await r.json();if(!j.ok)throw new Error(j.fout||"mislukt");return j;
}
function n0(plus){const d=new Date();d.setDate(d.getDate()+(plus||0));d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function openMelding(l){
  terug=document.activeElement;
  const dir=l==="DIR",p=$("#paneel");
  const velden=dir?
    '<label>Wat moet er gebeuren?<textarea id="m_tekst" required></textarea></label>'+
    '<label>Actiehouder<input type="text" id="m_actie" required></label>'+
    '<div class="twee"><label>Datum<input type="date" id="m_dat" required value="'+n0(1)+'"></label><label>Jouw naam<input type="text" id="m_naam" required value="'+esc(naam())+'"></label></div>':
    '<label>Wat is er aan de hand?<textarea id="m_tekst" required></textarea></label>'+
    '<div class="twee"><label>Lijn<select id="m_lijn"><option>Lijn 1</option><option>Lijn 2</option><option>Lijn 3</option><option>Overig</option></select></label><label>Machine<input type="text" id="m_mach"></label></div>'+
    '<label>Jouw naam<input type="text" id="m_naam" required value="'+esc(naam())+'"></label>'+
    '<div class="twee"><label>Actiehouder<input type="text" id="m_actie"></label><label>Opvolgen voor<input type="date" id="m_dat" value="'+n0()+'"></label></div>'+
    '<label class="vink"><input type="checkbox" id="m_bon"'+(l==="S"?"":" checked")+'> Technische dienst nodig: maak een CM-bon</label>';
  p.innerHTML='<div class="pkopbalk"><div><small>'+esc(LETTERS[l])+'</small><h2 id="ptitel">'+(dir?"Actie toevoegen":"Melding maken")+'</h2></div><button class="icoonknop" id="psl" aria-label="Sluiten">'+ico("sluit")+'</button></div><form class="meldform" id="meldform">'+velden+
    '<p class="fout" id="m_fout" hidden>Versturen is niet gelukt. Controleer je verbinding en probeer het opnieuw.</p>'+
    '<button class="knop hoofd" id="m_knop" type="submit">'+(dir?"Actie toevoegen":"Melding versturen")+'</button></form>';
  p.hidden=false;$("#paneelwaas").hidden=false;$("#psl").addEventListener("click",sluitPaneel);$("#m_tekst").focus();
  $("#meldform").addEventListener("submit",async e=>{
    e.preventDefault();const k=$("#m_knop");k.disabled=true;$("#m_fout").hidden=true;
    const w=id=>{const x=$(id);return x?x.value.trim():""};
    const wie=w("#m_naam");naam(wie);
    const d={actie:"nieuw",letter:l,melding:w("#m_tekst"),lijn:w("#m_lijn"),machine:w("#m_mach"),melder:wie,actiehouder:w("#m_actie"),datum:w("#m_dat").split("-").reverse().join("-"),bon_nodig:!!($("#m_bon")&&$("#m_bon").checked)};
    try{const j=await stuur(d);MELDINGEN=(MELDINGEN||[]).concat([Object.assign({},d,{id:j.id,tijd:j.tijd,status:"Open",bon_nodig:d.bon_nodig?"Ja":"Nee"})]);sluitPaneel();vSqd();melder(dir?"Actie toegevoegd":"Melding verstuurd")}
    catch(_){$("#m_fout").hidden=false;k.disabled=false}
  });
}
function openDetailMelding(m){
  terug=document.activeElement;
  const v=[["Gemeld",m.tijd],["Door",m.melder],["Lijn",m.lijn],["Machine",m.machine],["Actiehouder",m.actiehouder||"Nog toewijzen"],[m.letter==="DIR"?"Datum":"Opvolgen voor",m.datum],["CM-bon",m.letter==="DIR"?null:m.bon_nodig]];
  const p=$("#paneel");
  p.innerHTML='<div class="pkopbalk"><div><small>'+esc(LETTERS[m.letter]||"")+'</small><h2 id="ptitel">'+esc(m.melding)+'</h2></div><button class="icoonknop" id="psl" aria-label="Sluiten">'+ico("sluit")+'</button></div><dl class="velden">'+v.filter(x=>!leeg(x[1])).map(x=>"<dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd>").join("")+'</dl><div class="melding-acties"><p class="fout" id="m_fout" hidden>Afmelden is niet gelukt. Probeer het opnieuw.</p><button class="knop hoofd" id="m_klaar">Markeer als afgehandeld</button></div>';
  p.hidden=false;$("#paneelwaas").hidden=false;$("#psl").addEventListener("click",sluitPaneel);
  $("#m_klaar").addEventListener("click",async e=>{
    e.target.disabled=true;
    try{await stuur({actie:"gereed",id:m.id,door:naam()});MELDINGEN=MELDINGEN.filter(x=>x.id!==m.id);sluitPaneel();vSqd();melder(m.letter==="DIR"?"Actie afgehandeld":"Melding afgehandeld")}
    catch(_){$("#m_fout").hidden=false;e.target.disabled=false}
  });
}
function vSqd(){
  const s=D.sqdc||{},auto=s.auto||{},m=MELD(),live=m&&MELDINGEN&&!MELDFOUT;
  const acties=(s.directie_acties||[]).filter(a=>!a.gereed).concat((MELDINGEN||[]).filter(x=>x.letter==="DIR").map(x=>({actie:x.melding,actiehouder:x.actiehouder,datum:x.datum,_m:x})));
  const bord=(s.vakken||[]).map(v=>{
    const open=(MELDINGEN||[]).filter(x=>x.letter===v.letter);
    const kleur=open.length?"rood":(v.kleur||(live?"groen":""));
    const lbl=open.length?'<span class="st crit"><i></i>'+open.length+(open.length===1?" open melding":" open meldingen")+"</span>":kleur==="groen"?'<span class="st ok"><i></i>'+(live?"Geen open meldingen":"Groen")+"</span>":kleur==="rood"?'<span class="st crit"><i></i>Rood</span>':'<span class="st"><i></i>'+(m&&MELDFOUT?"Meldingen niet bereikbaar":"Nog niet gemeld")+"</span>";
    const c=(auto[v.letter]||[]).map(a=>"<div><dt>"+esc(a.label)+"</dt><dd>"+esc(a.waarde)+"</dd></div>").join("");
    const pt=(v.punten||[]).length?'<ul class="punten">'+v.punten.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":"";
    const lijst=open.length?'<div class="meldingen">'+open.map(x=>'<button class="melding" data-melding="'+esc(x.id)+'"><b>'+esc(x.melding)+"</b><small>"+esc([x.lijn,x.machine].filter(Boolean).join(", "))+(x.actiehouder?". Actie: "+esc(x.actiehouder)+(x.datum?", "+esc(x.datum):""):". Nog geen actiehouder")+"</small></button>").join("")+"</div>":"";
    const geen=!pt&&!lijst?'<p class="geenpunten">Geen bijzonderheden gemeld.</p>':"";
    const knop=m?'<button class="knop" data-meld="'+esc(v.letter)+'">Melding maken</button>':"";
    return'<section class="pijler '+esc(kleur)+'"><div class="pkop"><span class="letter" aria-hidden="true">'+esc(v.letter)+"</span><div><h2>"+esc(v.naam)+"</h2>"+lbl+"</div></div>"+(c?'<dl class="cijfers">'+c+"</dl>":"")+pt+lijst+geen+knop+"</section>";
  }).join("");
  const cols=[
    {k:"a",l:"Actie",c:"m-main",x:"titel",r:a=>esc(a.actie)},
    {k:"h",l:"Actiehouder",w:"200px",c:"m-sub",ml:"Actiehouder",r:a=>of(a.actiehouder,"Nog toewijzen")},
    {k:"d",l:"Datum",w:"190px",c:"m-sub",ml:"Datum",x:"nowrap",r:a=>of(a.datum)+(verlopen(a.datum)?' <span class="st crit"><i></i>Verlopen</span>':"")}];
  let html=kop("SQD-overzicht",hoofd(langeDatum(new Date())),true)+'<div class="bord">'+bord+"</div>";
  html+='<section class="deel"><div class="deelkop"><h2>Directie-actie binnen 24 uur<span>'+acties.length+"</span></h2>"+(m?'<button class="knop" data-meld="DIR">Actie toevoegen</button>':"")+"</div>"+(acties.length?vasteTabel(cols,acties,a=>{if(a._m)openDetailMelding(a._m);return null},a=>verlopen(a.datum)?" laat":""):'<div class="leegmelding">Geen open acties voor de directie.</div>')+"</section>";
  $("#view").innerHTML=html;
}

/* ---- dagstartlijsten ---- */

  const r=D.storingen||[];

    seg:{get:x=>x.status,o:["Open","In bestelling","Gepland"]},

      {k:"nr",l:"Bon",w:"72px",c:"m-nr",x:"nr",r:x=>esc(x.nr),s:x=>nummer(x.nr)},

    detail:x=>{const c=(D.cm||[]).find(y=>y.nr===x.nr);return c?cmDetail(c):{klein:x.nr,titel:x.storing,velden:[["Status",st(x.status),true],["Prio",x.prio?prio(x.prio):null,true],["Lijn",x.lijn],["Machine",x.machine],["Actiehouder",x.actiehouder||"Nog toewijzen"]]}}
  });
}

function vZaterdag(){
  const s=D.zaterdag||{},c=s.correctief||[],p=s.preventief||[],d=datum(s.datum);

/* ---- navigatie ---- */
function route(){
  const h=location.hash.replace("#","");
  HUIDIG=PAGINAS.some(p=>p.id===h)?h:"sqd";
  document.querySelectorAll("#nav a").forEach(a=>a.dataset.v===HUIDIG?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  document.querySelectorAll("#stappen button").forEach(b=>b.setAttribute("aria-current",String(b.dataset.v===HUIDIG)));
    if(!$("#paneel").hidden)sluitPaneel();
  menu(false);
  if(document.documentElement.classList.contains("present")&&!P_DAG.some(p=>p.id===HUIDIG))presenteer(false);
  vasteTabel.reg={};
  SCHERM[HUIDIG]();
  window.scrollTo(0,0);
}
function menu(open){$("#side").classList.toggle("open",open);$("#menuwaas").hidden=!open}
function presenteer(aan){
  document.documentElement.classList.toggle("present",aan);
  const el=document.documentElement;
  try{if(aan&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});else if(!aan&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(_){}
}
function start(data){
  D=data;
  const td=!!D.cm;
  PAGINAS=P_DAG.concat(td?P_TD:[]);
  D.cm=D.cm||[];D.bestellijst=D.bestellijst||[];D.priolijst=D.priolijst||[];D.opnamelijsten=D.opnamelijsten||[];D.pm=D.pm||[];
  const lnk=p=>'<a href="#'+p.id+'" data-v="'+p.id+'">'+ico(p.i)+esc(p.t)+"</a>";
  $("#nav").innerHTML='<div class="sectie"><span class="kopje">Dagstart</span>'+P_DAG.map(lnk).join("")+"</div>"+(td?'<div class="sectie"><span class="kopje">Technische dienst</span>'+P_TD.map(lnk).join("")+"</div>":"");
  $("#stappen").innerHTML=P_DAG.map(p=>'<button data-v="'+p.id+'">'+esc(p.kort)+"</button>").join("");
  $("#stand").textContent="Bijgewerkt "+((D.meta&&D.meta.stand)||"");
  $("#menu").innerHTML=ico("menu");
  $("#pdatum").textContent="Dagstart, "+new Date().toLocaleDateString("nl-NL",{day:"numeric",month:"long"});
  $("#menu").addEventListener("click",()=>menu(true));
  $("#menuwaas").addEventListener("click",()=>menu(false));
  $("#paneelwaas").addEventListener("click",sluitPaneel);
  $("#psluit").addEventListener("click",()=>presenteer(false));
  $("#stappen").addEventListener("click",e=>{const b=e.target.closest("button");if(b)location.hash=b.dataset.v});
  document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&document.documentElement.classList.contains("present"))presenteer(false)});
  $("#lock").hidden=true;$("#app").hidden=false;
  window.addEventListener("hashchange",route);route();
  if(MELD()){haalMeldingen();klok=setInterval(()=>{if(!document.hidden)haalMeldingen()},60000)}
}

/* ---- wachtwoord ---- */
const SLEUTEL="td-hub-sleutel";
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const naarB64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function ontsleutel(k,box){
  for(const b of box.boxes){
    try{const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(b.iv)},k,b64(b.ct));return JSON.parse(new TextDecoder().decode(p))}catch(_){}
  }
  throw new Error("wachtwoord");
}
async function afleiden(pw,box){
  const basis=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(box.salt),iterations:box.iter,hash:"SHA-256"},basis,{name:"AES-GCM",length:256},true,["decrypt"]);
}
function slot(box){
  $("#lock").hidden=false;
  $("#lockform").addEventListener("submit",async e=>{
    e.preventDefault();$("#lockerr").hidden=true;
    const k=$("#lockbtn");k.disabled=true;k.textContent="Bezig";
    try{
      const sl=await afleiden($("#pw").value,box),data=await ontsleutel(sl,box);
      if($("#rem").checked){const raw=await crypto.subtle.exportKey("raw",sl);try{localStorage.setItem(SLEUTEL,naarB64(raw))}catch(_){}}
      start(data);
    }catch(_){$("#lockerr").hidden=false;k.disabled=false;k.textContent="Openen"}
  });
}
async function boot(){
  const p=JSON.parse($("#payload").textContent);
  if(MODE!=="enc"){start(p);return}
  let s=null;try{s=localStorage.getItem(SLEUTEL)}catch(_){}
  if(s){try{const k=await crypto.subtle.importKey("raw",b64(s),"AES-GCM",false,["decrypt"]);start(await ontsleutel(k,p));return}catch(_){}}
  slot(p);
}
boot();
})();
