<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>TD Overzichten</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: zwarte kopbalken zoals op de werkbon F.95.602, daaronder lijsten per lijn. Samenvatting eerst, detail klapt open. */
:root{
  --paper:#EDF0EE;--panel:#FFFFFF;--ink:#14181A;--muted:#55605F;--line:#D2D8D5;
  --bar:#14181A;--bar-ink:#FFFFFF;--bar-muted:#AEB8B5;--tape:#F2C200;
  --red:#A9231B;--red-bg:#FBE3E0;--orange:#9C4A08;--orange-bg:#FCE7D4;--amber:#715400;--amber-bg:#FAEFC2;
  --blue:#0A5599;--blue-bg:#DEEAF7;--green:#196336;--green-bg:#DCEFE2;--grey:#55605F;--grey-bg:#E3E7E5;
  --font:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1214;--panel:#171B1E;--ink:#E8ECEA;--muted:#9AA5A3;--line:#2B3236;
  --bar:#000000;--bar-ink:#FFFFFF;--bar-muted:#9AA5A3;--tape:#F2C200;
  --red:#FF9C93;--red-bg:#3F1613;--orange:#FFB877;--orange-bg:#3C2410;--amber:#EFD36A;--amber-bg:#352B0A;
  --blue:#8FC3F5;--blue-bg:#12304D;--green:#8AD6A5;--green-bg:#13361F;--grey:#A9B3B1;--grey-bg:#262C2F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1214;--panel:#171B1E;--ink:#E8ECEA;--muted:#9AA5A3;--line:#2B3236;
  --bar:#000000;--bar-ink:#FFFFFF;--bar-muted:#9AA5A3;--tape:#F2C200;
  --red:#FF9C93;--red-bg:#3F1613;--orange:#FFB877;--orange-bg:#3C2410;--amber:#EFD36A;--amber-bg:#352B0A;
  --blue:#8FC3F5;--blue-bg:#12304D;--green:#8AD6A5;--green-bg:#13361F;--grey:#A9B3B1;--grey-bg:#262C2F;
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.35 var(--font);font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--tape);outline-offset:1px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* kop */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);color:var(--bar-ink)}
.brand{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:0 12px;padding-block:10px 4px}
.brand h1{margin:0;font-size:1.25rem;font-weight:700;letter-spacing:.01em}
.brand .stand{color:var(--bar-muted);font-size:.9rem;white-space:nowrap}
nav.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-block:2px 0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{color:var(--bar-muted);text-decoration:none;font-weight:600;padding:6px 0 8px;white-space:nowrap;border-bottom:3px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--bar-ink);border-bottom-color:var(--tape)}

main{padding-block:16px 28px}
main .stack{display:flex;flex-direction:column;gap:18px}
h2.view{margin:0;font-size:1.5rem;font-weight:700;text-wrap:balance}
p.lead{margin:2px 0 0;color:var(--muted)}

/* kengetallen */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--panel);padding:10px 12px;text-decoration:none;color:inherit;display:block}
.stat b{display:block;font-size:2rem;line-height:1.05;font-weight:700}
.stat span{color:var(--muted);font-size:.95rem}
.stat.alert b{color:var(--red)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters input[type=search]{flex:1 1 220px;min-width:0}
.filters input[type=search],.filters select{font:inherit;font-size:16px;padding:8px 10px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:0;max-width:100%}
.filters label.check{display:inline-flex;gap:6px;align-items:center;font-weight:500}
.count{color:var(--muted);font-size:.95rem}

/* lijsten */
.group{border:1px solid var(--line);background:var(--panel)}
.bar{background:var(--bar);color:var(--bar-ink);padding:5px 12px;display:flex;justify-content:space-between;gap:12px;font-weight:600;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase}
.bar span:last-child{color:var(--bar-muted);letter-spacing:0;text-transform:none}
.row{border-top:1px solid var(--line);content-visibility:auto;contain-intrinsic-size:auto 58px}
.bar + .row{border-top:0}
.row .head{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 12px;list-style:none}
details.row > summary{cursor:pointer}
details.row > summary::-webkit-details-marker{display:none}
details.row[open] > summary{background:var(--grey-bg)}
.nr{font-family:var(--mono);font-weight:600;font-size:.84rem;padding-top:.15em;overflow-wrap:anywhere}
.main{min-width:0}
.main b{display:block;font-weight:600;overflow-wrap:anywhere}
.main small{display:block;color:var(--muted);font-size:.93rem;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:15rem}
.pill{display:inline-block;padding:1px 8px;font-size:.82rem;font-weight:600;border-radius:999px;white-space:nowrap;background:var(--grey-bg);color:var(--grey)}
.pill.red{background:var(--red-bg);color:var(--red)}
.pill.orange{background:var(--orange-bg);color:var(--orange)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.blue{background:var(--blue-bg);color:var(--blue)}
.pill.green{background:var(--green-bg);color:var(--green)}
.prio{display:inline-block;padding:1px 6px;font-size:.82rem;font-weight:700;background:var(--grey-bg);color:var(--grey)}
.prio.p1{background:var(--red);color:var(--panel)}
.prio.p2{background:var(--orange-bg);color:var(--orange)}
dl.facts{display:grid;grid-template-columns:8.5rem minmax(0,1fr);gap:3px 12px;margin:0;padding:8px 12px 12px calc(5.2rem + 22px)}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.empty{padding:14px 12px;color:var(--muted)}
.more{display:block;padding:8px 12px;border-top:1px solid var(--line);font-weight:600;text-decoration:none}
footer.note{padding-block:0 28px;color:var(--muted);font-size:.93rem}

@media (max-width:640px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row .head{grid-template-columns:4.6rem minmax(0,1fr)}
  .tags{grid-column:2;justify-content:flex-start;max-width:none}
  dl.facts{grid-template-columns:minmax(0,1fr);padding-left:12px;gap:0}
  dl.facts dt{margin-top:6px;font-size:.88rem}
}

/* wachtwoord */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#lock form{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line)}
#lock .fields{display:flex;flex-direction:column;gap:10px;padding:14px 12px}
#lock label{font-weight:600}
#lock input[type=password]{font:inherit;font-size:16px;padding:9px 10px;width:100%;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:0}
#lock .remember{display:flex;gap:8px;align-items:center;font-weight:500}
#lock button{font:inherit;font-weight:700;padding:10px;background:var(--bar);color:var(--bar-ink);border:0;cursor:pointer}
#lock .err{color:var(--red);margin:0;font-weight:500}
</style>

<div id="lock" hidden>
  <form id="lockform" autocomplete="off">
    <div class="bar"><span>TD Overzichten</span><span>Alleen lezen</span></div>
    <div class="fields">
      <label for="pw">Wachtwoord</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <label class="remember" for="rem"><input id="rem" type="checkbox" checked> Onthoud op dit apparaat</label>
      <p class="err" id="lockerr" hidden>Dit wachtwoord klopt niet. Vraag het na bij de werkvoorbereider.</p>
      <button type="submit" id="lockbtn">Openen</button>
    </div>
  </form>
</div>

<div id="app" hidden>

  </div></header>
  <main class="wrap"><div class="stack" id="view"></div></main>

</div>

<script>
(function(){
"use strict";
var MODE="enc";
var D=null;
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function norm(s){return String(s==null?"":s).toLowerCase()}
function join(){return [].slice.call(arguments).filter(function(x){return x!=null&&x!==""}).join(" · ")}
function uniq(a){var o=[];a.forEach(function(x){if(x!=null&&x!==""&&o.indexOf(x)<0)o.push(x)});return o}

var VIEWS=[["start","Overzicht"],["cm","CM-bonnen"],["zaterdag","Zaterdag"],["bestel","Bestellijst"],["prio","Priolijst"],["opname","Opnamelijsten"],["pm","PM-taken"]];
var CLOSED=["Uitgevoerd","Gereed","Dubbel","Vervallen"];
function isOpen(r){return CLOSED.indexOf(r.status)<0}
var STATUS={"Open":"","Gepland":"blue","Besteld":"orange","Deels uitgevoerd":"amber","On hold":"red","Uitgevoerd":"green","Gereed":"green","Dubbel":"","Vervallen":""};
var STATUS_ORDER=["On hold","Open","Gepland","Deels uitgevoerd","Besteld","Uitgevoerd","Gereed","Dubbel","Vervallen"];
var LIJNEN=["Lijn 1","Lijn 2","Lijn 3","Overig","Lijn onbekend"];
function lijnGroep(r){var l=r.lijn;if(l==="Lijn 1"||l==="Lijn 2"||l==="Lijn 3")return l;if(!l||/n\.t\.b/.test(l))return"Lijn onbekend";return"Overig"}
var BESTEL_ORDER=["Nog niet besteld","Eerst opmeten of checken","Opgevraagd","Besteld","Binnen"];
var BESTEL_KLEUR={"Nog niet besteld":"orange","Eerst opmeten of checken":"amber","Opgevraagd":"amber","Besteld":"blue","Binnen":"green"};
function stand(k){return D.meta&&D.meta.standen&&D.meta.standen[k]||""}
function pill(t,c){return t?'<span class="pill '+(c||"")+'">'+esc(t)+"</span>":""}
function statusPill(s){return pill(s,STATUS[s])}
function prioChip(p){return p?'<span class="prio p'+esc(p)+'">Prio '+esc(p)+"</span>":""}
function facts(pairs){
  var h=pairs.filter(function(p){return p[1]!=null&&p[1]!==""}).map(function(p){return"<dt>"+esc(p[0])+"</dt><dd>"+(p[2]?p[1]:esc(p[1]))+"</dd>"}).join("");
  return h?'<dl class="facts">'+h+"</dl>":"";
}
function row(nr,title,sub,tags,factsHtml){
  var head='<span class="nr">'+esc(nr)+'</span><span class="main"><b>'+esc(title)+"</b>"+(sub?"<small>"+esc(sub)+"</small>":"")+'</span><span class="tags">'+tags+"</span>";
  if(factsHtml)return'<details class="row"><summary class="head">'+head+"</summary>"+factsHtml+"</details>";
  return'<div class="row"><div class="head">'+head+"</div></div>";
}
function group(title,right,body){return'<section class="group"><div class="bar"><span>'+esc(title)+"</span><span>"+esc(right)+"</span></div>"+body+"</section>"}
function n(x,one,many){return x+" "+(x===1?one:many)}

/* ---- rijen per lijst ---- */
function cmRow(r){
  return row(r.nr,r.omschrijving,join(r.lijn,r.machine),prioChip(r.prio)+statusPill(r.status),facts([
    ["Melder",r.melder],["Uitvoeren op",r.uitvoeren],["Onderdelen",r.onderdelen],["Opmerking",r.opmerking],
    ["Uitgevoerd op",r.uitgevoerd_op],["Monteur",r.monteur],["Afgetekend",r.afgetekend],["Bron",r.bron]]));
}
function satRow(r){
  return row(r.nr||"–",r.werkzaamheid,r.lijn_machine,prioChip(r.prio)+pill(r.gereed?"Gereed":"","green"),facts([["Uitvoerder",r.uitvoerder]]));
}
function bestelRow(r){
  var link=r.link&&/^https?:/i.test(r.link)?'<a href="'+esc(r.link)+'" target="_blank" rel="noopener">Open bij leverancier</a>':null;
  return row(r.cm||"–",r.onderdeel,r.specificatie,(r.aantal!=null&&r.aantal!==""?pill(r.aantal+"×"):"")+pill(r.groep,BESTEL_KLEUR[r.groep]),
    facts([["Leverancier",r.leverancier],["Toelichting",r.toelichting],["Opmerking",r.opmerking],["Link",link,true]]));
}
function prioRow(r){
  var score=join(r.score_voedselveiligheid!=null?"Voedselveiligheid "+r.score_voedselveiligheid:null,r.score_veiligheid!=null?"Veiligheid "+r.score_veiligheid:null);
  var oc=(r.open_cm||[]);
  return row(r.pm_code||"–",r.machine,join(r.lijn,r.ol_bon),prioChip(r.prio)+(oc.length?pill(n(oc.length,"open bon","open bonnen"),"orange"):""),
    facts([["Score",score],["Open bonnen",oc.join(", ")],["Opmerking",r.opmerking]]));
}
function olRow(r){
  return row(r.ol||"–",r.machine,join(r.lijn,r.pm_code),pill(r.opname_gedaan?"Opname gedaan":"Opname open",r.opname_gedaan?"green":"")+pill(r.uitgewerkt?"Uitgewerkt":"Niet uitgewerkt",r.uitgewerkt?"green":""),facts([["Opmerking",r.opmerking]]));
}
function pmRow(r){
  var lot=norm(r.bedrijfstoestand).indexOf("uit")===0;
  return row(r.id,r.taak,join(r.onderdeel,r.frequentie),pill(lot?"LOTOTO":"In bedrijf",lot?"amber":""),
    facts([["PM-code",r.pm_code],["Discipline",r.discipline],["Benodigdheden",r.benodigdheden],["Opmerking",r.opmerking],["In Ultimo",r.in_ultimo]]));
}

/* ---- filterbaar lijstscherm ---- */
function select(id,label,opts,val){
  return'<select id="'+id+'" aria-label="'+esc(label)+'"><option value="">'+esc(label)+"</option>"+opts.map(function(o){return'<option value="'+esc(o)+'"'+(o===val?" selected":"")+">"+esc(o)+"</option>"}).join("")+"</select>";
}
var mem={};
function listView(cfg){
  var st=mem[cfg.key]||(mem[cfg.key]={q:"",f:{},only:cfg.onlyDefault===true});
  var html='<div><h2 class="view">'+esc(cfg.title)+"</h2>"+(cfg.lead?'<p class="lead">'+esc(cfg.lead)+"</p>":"")+"</div>";
  html+='<div class="filters"><input type="search" id="q" placeholder="Zoeken" aria-label="Zoeken" value="'+esc(st.q)+'">';
  cfg.selects.forEach(function(s){html+=select("f_"+s.key,s.label,s.options,st.f[s.key]||"")});
  if(cfg.only)html+='<label class="check" for="only"><input type="checkbox" id="only"'+(st.only?" checked":"")+"> "+esc(cfg.only.label)+"</label>";
  html+='</div><div class="count" id="count" role="status"></div><div class="stack" id="list"></div>';
  $("#view").innerHTML=html;
  function draw(){
    var q=norm(st.q).split(/\s+/).filter(Boolean);
    var rows=cfg.rows.filter(function(r){
      if(st.only&&cfg.only&&!cfg.only.test(r))return false;
      for(var i=0;i<cfg.selects.length;i++){var s=cfg.selects[i],v=st.f[s.key];if(v&&s.get(r)!==v)return false}
      if(q.length){var hay=norm(cfg.text(r));return q.every(function(w){return hay.indexOf(w)>=0})}
      return true;
    });
    $("#count").textContent=rows.length+" van "+cfg.rows.length+" "+cfg.unit;
    var groups={},order=[];
    rows.forEach(function(r){var g=cfg.groupBy(r)||"Overig";if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(r)});
    if(cfg.groupOrder)order.sort(function(a,b){var x=cfg.groupOrder.indexOf(a),y=cfg.groupOrder.indexOf(b);return(x<0?99:x)-(y<0?99:y)||String(a).localeCompare(String(b),"nl")});
    $("#list").innerHTML=order.length?order.map(function(g){return group(cfg.groupLabel?cfg.groupLabel(g):g,String(groups[g].length),groups[g].map(cfg.render).join(""))}).join(""):'<div class="group"><div class="empty">Niets gevonden. Pas de filters aan.</div></div>';
  }
  $("#q").addEventListener("input",function(e){st.q=e.target.value;draw()});
  cfg.selects.forEach(function(s){$("#f_"+s.key).addEventListener("change",function(e){st.f[s.key]=e.target.value;draw()})});
  if(cfg.only)$("#only").addEventListener("change",function(e){st.only=e.target.checked;draw()});
  draw();
}

/* ---- schermen ---- */
function vStart(){
  var cm=D.cm,open=cm.filter(isOpen),p1=open.filter(function(r){return r.prio===1}),hold=open.filter(function(r){return r.status==="On hold"}),wacht=open.filter(function(r){return r.status==="Besteld"||r.status==="Deels uitgevoerd"});
  var sat=D.zaterdag||{},satN=(sat.correctief||[]).length+(sat.preventief||[]).length;
  var todo=D.bestellijst.filter(function(r){return r.groep==="Nog niet besteld"});
  var html='<div class="stats">'+
    '<a class="stat" href="#cm"><b>'+open.length+"</b><span>Openstaande bonnen</span></a>"+
    '<a class="stat'+(p1.length?" alert":"")+'" href="#cm"><b>'+p1.length+"</b><span>Open met prio 1</span></a>"+
    '<a class="stat" href="#zaterdag"><b>'+satN+"</b><span>Zaterdag "+esc(sat.datum||"")+"</span></a>"+
    '<a class="stat" href="#bestel"><b>'+todo.length+"</b><span>Nog niet besteld</span></a></div>";
  function top(t,rows,lim,href){var b=rows.slice(0,lim).map(cmRow).join("");if(rows.length>lim)b+='<a class="more" href="'+href+'">Alle '+rows.length+" bekijken</a>";return rows.length?group(t,String(rows.length),b):""}
  html+=top("Open met prio 1",p1,8,"#cm")+top("On hold",hold,6,"#cm")+top("Wacht op onderdelen",wacht,8,"#cm");
  $("#view").innerHTML=html;
}
function vCm(){
  listView({key:"cm",title:"CM-bonnen",lead:stand("cm"),unit:"bonnen",rows:D.cm,
    selects:[
      {key:"lijn",label:"Alle lijnen",options:LIJNEN.filter(function(l){return D.cm.some(function(r){return lijnGroep(r)===l})}),get:lijnGroep},
      {key:"status",label:"Alle statussen",options:STATUS_ORDER.filter(function(s){return D.cm.some(function(r){return r.status===s})}),get:function(r){return r.status}},
      {key:"prio",label:"Alle prio's",options:["1","2","3"],get:function(r){return r.prio==null?"":String(r.prio)}}],
    only:{label:"Alleen openstaand",test:isOpen},onlyDefault:true,
    text:function(r){return[r.nr,r.lijn,r.machine,r.omschrijving,r.melder,r.onderdelen,r.opmerking,r.monteur].join(" ")},
    groupBy:lijnGroep,groupOrder:LIJNEN,render:cmRow});
}
function vZaterdag(){
  var s=D.zaterdag||{},c=s.correctief||[],p=s.preventief||[];
  var html='<div><h2 class="view">Zaterdagwerk '+esc(s.datum||"")+"</h2>"+(s.stand?'<p class="lead">'+esc(s.stand)+"</p>":"")+"</div>";
  html+=group("Correctief",String(c.length),c.length?c.map(satRow).join(""):'<div class="empty">Geen correctief werk ingepland.</div>');
  html+=group("Preventief",String(p.length),p.length?p.map(satRow).join(""):'<div class="empty">Geen preventief werk ingepland.</div>');
  $("#view").innerHTML=html;
}
function vBestel(){
  listView({key:"bestel",title:"Bestellijst",lead:stand("bestel"),unit:"regels",rows:D.bestellijst,
    selects:[
      {key:"status",label:"Alle statussen",options:BESTEL_ORDER.filter(function(g){return D.bestellijst.some(function(r){return r.groep===g})}),get:function(r){return r.groep}},
      {key:"lev",label:"Alle leveranciers",options:uniq(D.bestellijst.map(function(r){return r.leverancier})).sort(),get:function(r){return r.leverancier}}],
    only:{label:"Verberg wat binnen is",test:function(r){return r.groep!=="Binnen"}},onlyDefault:true,
    text:function(r){return[r.cm,r.onderdeel,r.specificatie,r.leverancier,r.opmerking].join(" ")},
    groupBy:function(r){return r.groep},groupOrder:BESTEL_ORDER,render:bestelRow});
}
function vPrio(){
  var lijnen=uniq(D.priolijst.map(function(r){return r.lijn}));
  listView({key:"prio",title:"Priolijst machines",lead:stand("prio"),unit:"machines",rows:D.priolijst,
    selects:[{key:"lijn",label:"Alle lijnen",options:lijnen,get:function(r){return r.lijn}}],
    text:function(r){return[r.machine,r.lijn,r.pm_code,r.ol_bon,r.opmerking,(r.open_cm||[]).join(" ")].join(" ")},
    groupBy:function(r){return r.prio?"Prio "+r.prio:"Geen prio"},groupOrder:["Prio 1","Prio 2","Prio 3","Geen prio"],render:prioRow});
}
function vOpname(){
  var o=D.opnamelijsten,done=o.filter(function(r){return r.opname_gedaan}).length,uit=o.filter(function(r){return r.uitgewerkt}).length;
  listView({key:"opname",title:"Opnamelijsten",lead:done+" van "+o.length+" opgenomen, "+uit+" uitgewerkt. "+stand("opname"),unit:"lijsten",rows:o,
    selects:[{key:"lijn",label:"Alle lijnen",options:uniq(o.map(function(r){return r.lijn})),get:function(r){return r.lijn}}],
    only:{label:"Alleen nog niet opgenomen",test:function(r){return!r.opname_gedaan}},
    text:function(r){return[r.ol,r.machine,r.lijn,r.pm_code,r.opmerking].join(" ")},
    groupBy:function(r){return r.lijn},render:olRow});
}
function vPm(){
  var p=D.pm;
  listView({key:"pm",title:"PM-taken",lead:stand("pm"),unit:"taken",rows:p,
    selects:[
      {key:"lijn",label:"Alle lijnen",options:uniq(p.map(function(r){return r.lijn})),get:function(r){return r.lijn}},
      {key:"freq",label:"Alle frequenties",options:uniq(p.map(function(r){return r.frequentie})),get:function(r){return r.frequentie}},
      {key:"bt",label:"In en uit bedrijf",options:uniq(p.map(function(r){return r.bedrijfstoestand})),get:function(r){return r.bedrijfstoestand}}],
    text:function(r){return[r.id,r.lijn,r.lijndeel,r.onderdeel,r.taak,r.benodigdheden,r.pm_code].join(" ")},
    groupBy:function(r){return join(r.lijn,r.lijndeel)},render:pmRow});
}
var RENDER={start:vStart,cm:vCm,zaterdag:vZaterdag,bestel:vBestel,prio:vPrio,opname:vOpname,pm:vPm};

function route(){
  var h=location.hash.replace("#","");if(!RENDER[h])h="start";
  document.querySelectorAll("#tabs a").forEach(function(a){if(a.dataset.v===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current")});
  RENDER[h]();window.scrollTo(0,0);
}
function start(data){
  D=data;D.cm=D.cm||[];D.bestellijst=D.bestellijst||[];D.priolijst=D.priolijst||[];D.opnamelijsten=D.opnamelijsten||[];D.pm=D.pm||[];
  $("#stand").textContent="Stand "+(D.meta&&D.meta.stand||"");
  $("#tabs").innerHTML=VIEWS.map(function(v){return'<a href="#'+v[0]+'" data-v="'+v[0]+'">'+esc(v[1])+"</a>"}).join("");
  $("#lock").hidden=true;$("#app").hidden=false;
  window.addEventListener("hashchange",route);route();
}

/* ---- wachtwoordslot (alleen in de publieke versie) ---- */
var KEYNAME="td-overzichten-sleutel";
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function toB64(u){var s="";new Uint8Array(u).forEach(function(c){s+=String.fromCharCode(c)});return btoa(s)}
function decrypt(key,box){return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(box.iv)},key,b64(box.ct)).then(function(p){return JSON.parse(new TextDecoder().decode(p))})}
function derive(pw,box){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(box.salt),iterations:box.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
  });
}
function lockUi(box){
  $("#lock").hidden=false;
  $("#lockform").addEventListener("submit",function(e){
    e.preventDefault();$("#lockerr").hidden=true;$("#lockbtn").disabled=true;$("#lockbtn").textContent="Bezig…";
    var key;
    derive($("#pw").value,box).then(function(k){key=k;return decrypt(k,box)}).then(function(data){
      if($("#rem").checked)return crypto.subtle.exportKey("raw",key).then(function(raw){try{localStorage.setItem(KEYNAME,toB64(raw))}catch(_){}return data});
      return data;
    }).then(start).catch(function(){$("#lockerr").hidden=false;$("#lockbtn").disabled=false;$("#lockbtn").textContent="Openen"});
  });
}
function boot(){
  var payload=JSON.parse($("#payload").textContent);
  if(MODE!=="enc"){start(payload);return}
  var saved=null;try{saved=localStorage.getItem(KEYNAME)}catch(_){}
  if(saved){
    crypto.subtle.importKey("raw",b64(saved),"AES-GCM",false,["decrypt"]).then(function(k){return decrypt(k,payload)}).then(start).catch(function(){lockUi(payload)});
  }else lockUi(payload);
}
boot();
})();
